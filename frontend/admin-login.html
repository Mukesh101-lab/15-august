<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>🇮🇳 Admin Login</title>

    <link
        rel="stylesheet"
        href="admin-login.css"
    >

</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <div class="flag-icon">
                🇮🇳
            </div>

            <div class="date">
                15 AUGUST
            </div>

            <h1>
                Admin Login
            </h1>

            <p class="subtitle">
                Independence Day Dashboard
            </p>


            <form id="loginForm">

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="loginBtn"
                >
                    🔐 Login
                </button>

            </form>


            <p
                id="loginStatus"
                class="login-status"
            ></p>


            <a
                href="index.html"
                class="back-link"
            >
                ← Back to Website
            </a>

        </div>

    </main>


    <script src="admin-login.js"></script>

</body>

</html>
